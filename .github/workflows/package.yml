name: package

# The OnePlus Ace 3 (aston) iOS 27 (iPhone17,2 identity, branch ios27) kernel and payload on a macOS runner: the 24A446 kernel (xnu-12377) needs Xcode's clang, and the
# Data seed, the Metal plugin (Mesa Turnip + metal2vulkan, scripts/build-adreno-metal-plugin.py --target ios27 through the payload
# runtime) and their owner trust bundle need macOS tools. The firmware and the boot image are not built here: the Ace 3 runs the
# Mu-Silicium "aston" firmware of Ace3-UniXNU, which packs its own boot image.
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the payload, so the run's artifacts belong
# to one device alone: download them, then delete the run. The Ace 3's own Adreno ZAP image (scripts/pull-aston-gpu-firmware.sh) may be
# given as the base64 secret ASTON_A740_ZAP_B64; it must match the pin in scripts/data/aston-gpu-inputs.json. Without it the kernel
# carries an empty ZAP image and the GPU stays off.

on:
  workflow_dispatch:
    inputs:
      init_data:
        description: "Create a NEW installation seed if no saved seed exists"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK: UniXNU/out/aston/ios-27.0.1-24A446/aston_ios27

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      # The Xcode the 24A446 kernel was first built with here (run 42460091603, the image default), and the line UniXNU's own macOS
      # workflow uses; pinned so an image update does not change the compiler under the build.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: UniXNU-aston
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # UniXNU main as of 2026-11-10: the 4K pager, union readdir and module load order fixes (f105b31), the root union's file
          # system number (ee54dcd), the calendar from the kernel's build date (d830d23) and RamBlock 60a54ce. Its drivers and
          # patches read the boot arguments without the sheng- prefix (47ec6a5; board.toml names the ones they read).
          ref: 00f47f6875749dec49bb782718dff1de28006856
          path: UniXNU
          submodules: false
      - name: UniXNU submodules
        # 47ec6a5 pins AppleKeyStoreState 6ff4f11d, which its repository does not have (2026-11-10). Every other submodule is
        # checked out at its pin; AppleKeyStoreState at its pin when that can be fetched, else at its main 58e5461 (the pin only
        # renamed boot arguments, and the driver reads none).
        working-directory: UniXNU
        run: |
          for p in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
            [ "$p" = drivers/AppleKeyStoreState ] && continue
            git submodule update --init --recursive -- "$p"
          done
          if ! git submodule update --init --recursive -- drivers/AppleKeyStoreState; then
            git -C drivers/AppleKeyStoreState fetch -q origin 58e5461ed3b751e4c91426b72d8686419abe9550
            git -C drivers/AppleKeyStoreState checkout -q --detach 58e5461ed3b751e4c91426b72d8686419abe9550
            # unixnu fetch and build run `git submodule update --init --recursive` themselves: record the fallback in this
            # checkout's index (not committed), so they keep it instead of fetching the missing pin again.
            git update-index --cacheinfo 160000,58e5461ed3b751e4c91426b72d8686419abe9550,drivers/AppleKeyStoreState
            echo "::warning::AppleKeyStoreState at 58e5461 instead of the unfetchable pin"
          fi
          git submodule status --recursive | awk '{print $1, $2}' | head -40
      - uses: actions/checkout@v4
        # Only the panic-screen font of the payload's entry probe (patch-xnu-entry-probe.py reads it through UNIXNU_UEFI), from
        # the Mu-Silicium revision Ace3-UniXNU builds the aston firmware from.
        with:
          repository: Project-Silicium/Mu-Silicium
          ref: 6b3d90b79e191e08171bfedd3980234a7e49d340
          path: Mu-Silicium
          sparse-checkout: Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib
      - name: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's release download answered 504 to brew for ipsw's archive in two runs (42464807991, 42470712683): retry, and if
          # ipsw is still missing take the same archive through the GitHub API, which kept working, checked against its SHA-256.
          for attempt in 1 2 3; do
            brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw && break
            echo "::warning::brew install failed (attempt $attempt)"; sleep 45
          done
          if ! command -v ipsw >/dev/null; then
            dir="$RUNNER_TEMP/ipsw"; archive=ipsw_3.1.743_macOS_arm64_extras.tar.gz
            gh release download v3.1.743 -R blacktop/ipsw -p "$archive" -D "$dir"
            echo "c7da3f9fba1901a608e81d06269f4050f60a5b55ebf7418535336bb9c8810eba  $dir/$archive" | shasum -a 256 -c -
            tar -xzf "$dir/$archive" -C "$dir"
            echo "$dir" >> "$GITHUB_PATH"; export PATH="$dir:$PATH"
          fi
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          # The Metal runtime build (Mesa Turnip and the translator) needs this Rust toolchain (the reference board's workflow).
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before the long build.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/bison/bin:$PATH"
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool mformat mcopy mtype ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ -f Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h ] || { echo "missing Font.h"; ok=0; }
          [ "$ok" = 1 ]
          xcodebuild -version
          echo "iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version), macosx SDK $(xcrun --sdk macosx --show-sdk-version)"
          df -h "$GITHUB_WORKSPACE"
      - name: driver checkouts
        run: bash UniXNU-aston/scripts/fetch-aston-drivers.sh UniXNU-aston
      - name: git sparse mode
        # Ath12kWifi's tools/fetch-sources.py clones with --sparse and adds root-anchored patterns ("/drivers/..."); the runner's
        # git starts sparse checkouts in cone mode, which rejects them. Pattern mode takes them as written.
        run: git config --global core.sparseCheckoutCone false
      - name: upstream Mesa patch
        # UniXNU's turnip-frame-diagnostics.patch creates a file without "new file mode", which git apply cannot apply to the fresh
        # Mesa checkout a runner always has; add that one line (the script names the exact upstream and fixed files).
        run: python3 UniXNU-aston/scripts/fix-upstream-mesa-patch.py UniXNU
      - name: iOS 27 profile
        # UniXNU has no iOS profile: unixnu-patches/ adds ios-27.0.1-24A446 (iPhone17,2 D94AP, after markakash/UniXNU-ishtar
        # 0001/0002/0005/0009 with the lockdown board-id) to the pinned checkout, and lets a new seed keep the first-boot migration.
        # XnuPrelink loads reviewed pins for the iPhone17,2 kernelcache (fa07057b) from its fixtures: UniXNU-ishtar's port of the
        # iPad17,3 pins plus scripts/derive-fileset-pins.py's. Without them 206 kext calls bind to the unmapped-call stub.
        # unixnu-patches/<component>/ patch that submodule: the Metal plugin's QuartzCore addresses keyed by shared cache, so the
        # iPhone17,2 cache gets its own and an unknown one none (the plugin's iPad addresses would land 0x4000 off in QuartzCore's data).
        working-directory: UniXNU
        run: |
          for p in ../UniXNU-aston/unixnu-patches/*.patch; do echo "apply $p"; git apply "$p"; done
          for d in ../UniXNU-aston/unixnu-patches/*/; do
            c=$(basename "$d"); path=drivers/$c
            [ -d "$path" ] || path=kits/$c
            [ -d "$path" ] || { echo "no component checkout for $c"; exit 1; }
            for p in "$d"*.patch; do echo "apply $p in $path"; git -C "$path" apply "$(pwd)/$p"; done
          done
          cp ../UniXNU-aston/scripts/fileset-24A446-d94ap-symbols.json kits/XnuPrelink/fixtures/
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          [ -n "$seed" ] || { echo "::error::set the repository secret UNIXNU_UNIQUE_CHIP_ID"; exit 1; }
      - name: Ace 3 ZAP image
        env:
          zap: ${{ secrets.ASTON_A740_ZAP_B64 }}
        run: |
          if [ -n "$zap" ]; then
            mkdir -p UniXNU-aston/.cache/firmware/aston-gpu/qcom/sm8550/aston
            printf '%s' "$zap" | base64 -d > UniXNU-aston/.cache/firmware/aston-gpu/qcom/sm8550/aston/a740_zap.mbn
          else
            echo "::warning::no ASTON_A740_ZAP_B64: the kernel carries an empty ZAP image and the GPU stays off"
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          echo "key=aston-ios27-data-$(printf '%s' "$SEED" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            ${{ env.WORK }}/runtime/data.dbr
            ${{ env.WORK }}/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}
      - name: prepare preserved Data seed
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path(os.environ['WORK']) / 'runtime/data.dbr'
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: host checks
        run: |
          python3 UniXNU-aston/scripts/check-aston-gauge-host.py
      - name: kernel and payload
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-aston
          UNIXNU_UEFI: ${{ github.workspace }}/Mu-Silicium
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          # A new seed skips Setup but not the first-boot data migration (unixnu-patches/0002): the migration registers the
          # system apps and makes their app and group containers, which the iPadOS seed never got. The first boot is slow.
          UNIXNU_SEED_FIRST_BOOT_MIGRATION: "1"
          # The Wi-Fi stack in the kernel (build-gop-legacy-display-27.py): room for its 75 KiB of __DATA comes from ShengUfs'
          # scratch buffer, now allocated at run time. Its firmware is not part of this build (root image object "Wifi").
          ASTON_WIFI: "1"
        run: |
          trap 'df -h . || true' EXIT
          ./unixnu defconfig aston_ios27_defconfig -D ../UniXNU-aston
          ./unixnu fetch -D ../UniXNU-aston
          ./unixnu ipsw fetch -D ../UniXNU-aston
          # One invocation: a new Data seed (--init-data) is made before the kernel, which binds its volume UUID.
          args=()
          if [ "$INIT_DATA" = true ]; then args+=(--init-data); fi
          ./unixnu build kernel payload -D ../UniXNU-aston "${args[@]}"
      - name: Ace 3 menu
        # The payload volume replaces the firmware's menu on this phone: keep "Switch to slot B" as the default.
        # Variants of the same kernel and Data: the BootLog rows of the sys, power, audio ([adsp]) and wifi (qrtr, which the DSP's
        # battery manager uses) groups, and a one-time rerun of the first-boot data migration (aston-migration-rerun.patch; no staged
        # apps copy, which the migration refuses as system app upgrades). The GPU path booted iOS on the phone (2026-11-11), so the CPU
        # display fallback entry is gone. "iOS 402x874" shows iOS a 1206 x 2622 window of the panel (aston-display=1,
        # aston-display-window.patch), a screen class iOS knows, for comparison. The two deep idle entries let idle cores ask the
        # hypervisor's PSCI for power-down states (unixnu-patches/ArmCpu: 2 every core but the boot core, CPU state only; 3 every
        # core and the cluster state); the default entry only reads PSCI (armcpu-idle=1). "iOS display survey" reads once what the
        # boot chain left running on the display path (aston-dpu=1, AstonDisplaySurvey.cpp: clocks, CTL 0 and the blocks it names,
        # INTF_1, DSI0 and its PHY; nothing written) for the board's own display driver. The longest line (Rebuild app data) is
        # about 957 bytes of DarwinBoot's 1024.
        run: |
          python3 UniXNU-aston/scripts/aston-payload-menu.py "$WORK/payload/payload.img" \
            --variant "xnu-diag|iOS diag (logs)|log-sys=1 log-power=1 log-audio=1 log-wifi=1" \
            --variant "xnu-idle2|iOS deep idle 2 (test, logs)|armcpu-idle=2 log-sys=1 log-power=1 log-wifi=1" \
            --variant "xnu-idle3|iOS deep idle 3 (test, logs)|armcpu-idle=3 log-sys=1 log-power=1 log-wifi=1" \
            --variant "xnu-window|iOS 402x874 (test, logs)|aston-display=1 log-sys=1 log-power=1 log-audio=1 log-wifi=1"             --variant "xnu-dpu|iOS display survey (logs)|aston-dpu=1 log-sys=1 log-power=1 log-wifi=1" \
            --variant "xnu-migrate|Rebuild app data (slow, once)|sheng-rerun-migration=1 log-sys=1 log-power=1 log-audio=1 log-wifi=1"
      - uses: actions/cache/save@v4
        if: always() && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/aston/ios-27.0.1-24A446/aston_ios27/runtime/data.dbr') != ''
        with:
          path: |
            ${{ env.WORK }}/runtime/data.dbr
            ${{ env.WORK }}/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}
      - name: installation seed backup
        if: always() && hashFiles('UniXNU/out/aston/ios-27.0.1-24A446/aston_ios27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed
          retention-days: 1
          path: |
            ${{ env.WORK }}/runtime/data.dbr
            ${{ env.WORK }}/runtime/inputs.json
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          retention-days: 3
          path: |
            ${{ env.WORK }}/logs/*.log
            ${{ env.WORK }}/tree/build/xnu/fileset-reference/*/*-build.log
            ${{ env.WORK }}/tree/build/xnu/fileset-reference/*/native-stubs.c
            ${{ env.WORK }}/tree/build/xnu/fileset-reference/*/omitted-unavailable-forced-exports.json
      # A failed prelink can be rerun offline with emit_prelink.py and the iPhone17,2 kernelcache: the native kernel, the
      # release reference it is matched with, and the pairing map, so one CI run is enough to bisect a layout or binding error.
      - name: prelink inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prelink-inputs
          retention-days: 3
          include-hidden-files: true
          path: |
            ${{ env.WORK }}/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            ${{ env.WORK }}/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
            ${{ env.WORK }}/kernel/.prelink-*/*.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: aston-ios27
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ env.WORK }}/kernel/kernel.macho
            ${{ env.WORK }}/payload/payload.img
            ${{ env.WORK }}/payload/payload.json
            ${{ env.WORK }}/payload/payload.img.menu.json
