schema_version = 2

# OnePlus Ace 3 PJE110 (project 23801, OnePlus board name "aston"), SM8550-AB, 16 GiB / 512 GiB, ColorOS 15.0.0.870(CN01).
# Derived from UniXNU-sheng 689400177f93219a38bd7cf5ae2e9f5782adc594 (Xiaomi Pad 6S Pro, the reference SM8550 board) and its
# iPadOS 27.0.1 (24A446) chain. The iPadOS 17 chain of that board needs prelinked candidate kernels qualified on sheng hardware
# (scripts/audit-mobile-graphics-legacy.py), which no other board can produce, so this board follows the 27 chain.
# Branch ios27: the same board on iOS 27.0.1 (24A446) as iPhone17,2 (D94AP), the profile of unixnu-patches/ (after
# markakash/UniXNU-ishtar, the SM8550 iOS 27 port). Stage A: CPU display, touch, keys, storage, battery and DSP; no GPU yet.
# The package keeps the reference kit name "sheng" (installed as kits/sheng) and the "sheng-*" boot argument names: the shared
# scripts and drivers address the board kit by that name.
[board]
name = "aston"
soc = "SM8550"
description = "OnePlus Ace 3 PJE110"
kit = "sheng"
soc_source = "sm8550"
os_profile = "ios-27.0.1-24A446"

# The iOS partition carved from the end of Android's userdata (dual_sys plan-32g, sda15, 32 GiB). ShengUfs is built to match the
# GPT name "unixnu" only (drivers/ShengUfs/RootLayout.h); Android's userdata is never opened. The image file keeps the upstream
# name userdata-root.img; it is written to unixnu, never to userdata.
[userdata]
partition = "unixnu"
first_lba = 115424000
last_lba = 123812607
lba_bytes = 4096

[kernel]
defconfig = "aston_ios27_defconfig"
config_fragments = ["arch:configs/common.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]
# The reference 24A446 archive chain. build-gop-legacy-display-27.py builds the board objects (touch, keys, brightness, battery,
# CPU frequency, GPU power) and links them against the original families of this fileset. fetch-sheng-dts.py and the prepare-sheng-*
# generators still read the reference board's devicetree for the GPU inputs (the same kalama GPU and GMU nodes).
archives = [
  "prepare-aston-ramblock.py",
  # Before any storage step: component:ShengUfs runs build-sheng-source-storage.py without --policy-dir.
  "stage-aston-root-policies.py scripts/policies/ios-27.0.1-24A446",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ios-27.0.1-24A446",
  "component:RamBlock",
  "component:Adreno740",
  "fetch-sheng-dts.py",
  "fetch-adreno-inputs.py",
  "prepare-sheng-gmu.py",
  "prepare-sheng-gpu-smmu.py",
  "prepare-sheng-gmu-votes.py",
  "build-adreno740-kits.py",
  "build-adreno740-accelerator.py",
  "component:AppleKeyStoreState",
  "build-gop-legacy-display-27.py",
  "build-fileset-release-reference.py --tree . --lto",
]

[kernel.prelink]
# The profile's roots plus the USB device and host stacks (the reference board's list; the SoC's USB controller is the same).
# The iPhone17,2 fileset has no com.apple.iokit.IOHIDEventDriver bundle (the class ships in IOHIDFamily).
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI", "com.apple.driver.AppleUSBDeviceMux",
  "com.apple.iokit.IOUSBHostFamily", "com.apple.driver.usb.AppleUSBXHCI", "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice", "com.apple.driver.usb.IOUSBHostHIDDevice", "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily", "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC",
]

[firmware]
# Not used: the Ace 3 firmware is Mu-Silicium "aston", built by Ace3-UniXNU/scripts/build-ram-probe.sh.
config = "aston"
dsc = "Platforms/OnePlus/astonPkg/aston.dsc"
fd = "Build/astonPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"

[payload]
volume = "ASTONESP"
size_mib = 176
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
loader = "firmware"
title = "iOS"
dram_size = "0x80000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
# Second test (2026-11-08). The first boot reached SpringBoard on the CPU display path: touch worked; the UI was slow, backboardd
# aborted and its render clients crashed in a loop, the wallpaper was missing (it comes with the GPU addon), the battery level was a
# placeholder, and scale 2 gave 632x1390 points, narrower than any iPad. These arguments add the Adreno 740 (the phone's own ZAP image,
# scripts/data/aston-gpu-inputs.json) with GPU frames written straight into the firmware framebuffer (sheng-fb-gpu=1; not the reference
# board's DPU scanout, sheng-dpu-scanout, which programs its own panel), the Metal -> Vulkan addon with the wallpapers
# (sheng-gpu-addon=1), the pack's fuel gauge (sheng-battery=2: bq28z610 on QUP2 SE0, read only) and scale 3 (421x927 points, the
# physical size of an iPhone at 3x on this 452 ppi panel). The payload menu (.github/workflows/package.yml) also offers the same boot
# at scale 2 and the first test's CPU display path, for comparison and as a fallback.
# Not ported to this board yet: sheng-backlight (DCS brightness through the Iris7P bridge), sheng-adsp, sheng-audio, sheng-wifi,
# sheng-bluetooth, sheng-usb.
kernel_args = [
  "-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0",
  "native-source-storage=1", "native-ufs-root=1",
  "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-legacy-register=1", "offline-legacy-gop=1",
  "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "offline-key-events=1",
  "sheng-aks=1", "offline-hid-input=1", "offline-hid-home=1",
  "sheng-touch=4", "sheng-touch-hid=1", "sheng-buttons=1", "sheng-log=1",
  "sheng-smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1", "armcpu-edge=1", "sheng-data-persist=2", "sheng-cpufreq=4",
  # Brief touch boost; continuous display activity must not impose a CPU frequency floor.
  "sheng-cpufreq-boost-ms=80", "sheng-cpufreq-frame-ms=0",
  # iOS stage A: no GPU arguments. The Adreno accelerator (CONFIG_XNU_NATIVE_ADRENO=n) and the Metal plugin are bound to the iPad
  # kernelcache and shared cache; the display is the CPU path the first iPadOS boot used.
  # The battery values come from the pack's fuel gauge (sheng-battery=2); charging itself is the battery manager in the audio DSP, so
  # the DSP is started (sheng-adsp=2, firmware read in place from modem_a, adspslpi 0x9ea00000 + 0x4880000 on this board).
  "sheng-battery=2", "sheng-adsp=2",
  # No sheng-staged-apps: on 27 the deletable system apps come through the staged apps union, and a copy in Data makes the
  # first-boot migration install them as system app upgrades, which installd refuses ("System app upgrade is missing upgrade
  # entitlement"; iPadOS boot 6, DMLastMigrationResults success = false).
  "sheng-no-lc=1", "sheng-vsync=60", "sheng-vsync-fixed=1", "sheng-disable-watchdogd=1", "sheng-lite=1",
]

[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "ios27"
build = "24A446"
# The Data volume inside unixnu after the OS root windows and the log. iOS: the root image is about 16.56 GB (OS 10223616000 and
# SystemOS 6023020544 bytes, the two .vroot tables and the payload), the store window of 14 GiB plus its bitmap starts at block
# 4456335 of unixnu (8388608 blocks, 1 GiB log reserve at the end), about 1.7 GB above the root image.
data_gib = 14
skip_setup = true
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]
# The iPadOS 27 wallpaper overlays name iPad paths; iOS has none yet.
wallpapers = []

[payload.runtime.launchd_job_environment."com.apple.iconservices.iconservicesagent"]
FORCE_SOFTWARE_RENDERER = "0"
CI_ENABLE_METAL_GPU = "0"

[payload.install]
title = "Install and boot"
confirm = "ERASE all iOS user data and install again?"
confirm_titles = ["Erase Data, skip Hello, boot", "Erase Data, show Hello, boot"]
confirm_args = ["sheng-data-reset=1", "sheng-data-reset=2"]

[payload.adt]
chip_id = "8142"
owned_memory_size = "0x130000000"
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"

[bootimg]
# The Mu-Silicium aston DTB that Ace3-UniXNU packs (out/phone/firmware.dtb, /chosen initrd keys removed). Mu-Silicium aston
# reserves the same splash range as sheng: "Display Reserved" 0xB8000000 + 0x2B00000 (astonPkg MemoryMapLib.c).
dtb = "../Ace3-UniXNU/out/phone/firmware.dtb"
dtb_node = [{ path = "/reserved-memory/splash_region", props = [{ name = "label", type = "s", value = "cont_splash_region" }, { name = "reg", type = "x", value = ["0x0", "0xb8000000", "0x0", "0x2b00000"] }] }]

[device_tree]
source = "device:dts/aston.dts"
include_dirs = ["soc:dts"]

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengPreflight", "ShengUfs", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "Adreno740", "AdrenoMetal"]

[adt.product.string]
# The iPad model override of the iPadOS chain (J120AP) is left out: the profile's iPhone17,2 identity stands.
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1
# No Apple PMGR or SEP: report a virtual platform, so AMFI does not wait for an ApplePMGRNub (as the reference board).
vmm-present = 1
# memory/64K + 1024 for the owned 4864 MiB (the reference value).
"kern.maxvnodes" = 78848

[adt.chosen.u32]
# SM8550 has no CTRR.
kernel-ctrr-to-be-enabled = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "aston_ipados27_defconfig"
"ios-27.0.1-24A446" = "aston_ios27_defconfig"
